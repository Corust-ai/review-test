name: Fetch OTel logs

# Pulls every corust-reviewer OTel log from Cloud Logging into a JSON
# artifact. Runs daily at UTC 18:00 (= Beijing 02:00 next day) and can be
# kicked off manually via the "Run workflow" button.
#
# Auth: GCP_CREDENTIALS_JSON secret holds an SA key for `otel-log-reader`,
# which has only `roles/logging.viewer` on the project — no write
# permissions, no other resource access.
#
# Output: artifact `otel-logs-<run_id>` containing one NDJSON file with
# every entry. 30-day retention so historical pulls accumulate without
# burning unlimited storage.

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Look back this many hours'
        required: false
        default: '24'
      max_entries:
        description: 'Cap on number of log entries to fetch'
        required: false
        default: '50000'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Fetch OTel logs
        env:
          HOURS: ${{ github.event.inputs.hours || '24' }}
          MAX_ENTRIES: ${{ github.event.inputs.max_entries || '50000' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Filter: every corust-reviewer log shipped through the OTel
          # collector (no installation_id / user filter — option (c)). The
          # service.name label is set on the OTel Resource at Pod startup
          # in app/observability.py.
          FILTER="logName=\"projects/${PROJECT_ID}/logs/otlp-logs\" AND labels.\"service.name\"=\"corust-reviewer\""

          echo "Fetching last ${HOURS}h of corust-reviewer OTel logs (cap: ${MAX_ENTRIES})..."
          gcloud logging read "$FILTER" \
            --freshness="${HOURS}h" \
            --limit="${MAX_ENTRIES}" \
            --format=json \
            --project="${PROJECT_ID}" \
            > out/otel-logs.json

          COUNT=$(jq 'length' out/otel-logs.json)
          echo "Fetched ${COUNT} log entries"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          # Quick breakdown by event_type for the run summary, so you can
          # spot the run's contents without having to download the artifact.
          {
            echo "## Fetched ${COUNT} log entries (last ${HOURS}h)"
            echo ""
            echo "### By event_type"
            echo '```'
            jq -r '.[] | .labels.event_type // "(none)"' out/otel-logs.json \
              | sort | uniq -c | sort -rn
            echo '```'
            echo "### By installation_id"
            echo '```'
            jq -r '.[] | .labels.installation_id // "(none)"' out/otel-logs.json \
              | sort | uniq -c | sort -rn | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otel-logs-${{ github.run_id }}
          path: out/otel-logs.json
          retention-days: 30
