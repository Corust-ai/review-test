[dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
